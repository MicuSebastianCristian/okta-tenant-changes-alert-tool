{% extends 'base.html' %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='edit_tenant.css') }}">
{% endblock %}

{% block content %}
<div class="edit-tenant-container">
  <div class="edit-tenant-header">
    <h2>
      <i data-feather="edit-3"></i>
      Edit Tenant
    </h2>
    <div class="tenant-env" data-env="{{ tenant.env }}">
      <i data-feather="box"></i>
      {{ tenant.env }}
    </div>
  </div>

  <div class="edit-tenant-form">
    <form method="post">
      <div class="form-section">
        <h3>
          <i data-feather="info"></i>
          Basic Information
        </h3>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" value="{{ tenant.name }}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Environment</label>
            <select name="environment" class="form-select">
              <option value="DEV" {% if tenant.env == 'DEV' %}selected{% endif %}>Development</option>
              <option value="STAGING" {% if tenant.env == 'STAGING' %}selected{% endif %}>Staging</option>
              <option value="PRODUCTION" {% if tenant.env == 'PRODUCTION' %}selected{% endif %}>Production</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Org URL</label>
          <input type="url" name="org_url" class="form-control" value="{{ tenant.org_url }}" required>
        </div>
      </div>

      <div class="form-section">
        <h3>
          <i data-feather="key"></i>
          Authentication
        </h3>
        <div class="form-group">
          <label class="form-label">API Token</label>
          <input type="text" name="token" class="form-control" value="{{ tenant.token }}" required>
        </div>
      </div>

      <div class="form-section">
        <h3>
          <i data-feather="bell"></i>
          Notifications
        </h3>
        <div class="form-group">
          <label class="form-label">Slack Webhook URL (optional)</label>
          <input type="url" name="slack_url" class="form-control" value="{{ tenant.slack_url or '' }}" placeholder="https://hooks.slack.com/...">
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="slack_high_severity_only" id="slack_high_severity_only" value="true" {% if tenant.slack_high_severity_only %}checked{% endif %}>
          <label class="form-check-label" for="slack_high_severity_only">
            Only send HIGH severity alerts to Slack
          </label>
        </div>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('main.tenant_detail', tenant_id=tenant.id) }}" class="btn btn-cancel">
          <i data-feather="x"></i>
          Cancel
        </a>
        <button type="submit" class="btn btn-primary">
          <i data-feather="save"></i>
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
